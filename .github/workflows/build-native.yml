name: Build Native

on:
  workflow_dispatch:
  push:
    branches: [ namknobs ]

env:
  PROJECT_NAME: NeuralAmpModeler

jobs:
  verify-parametric:
    name: Verify parametric control contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure + build verify_parametric
        run: |
          cmake -S ci -B ci/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ci/build --config Release -j
        shell: bash

      - name: Assert every bundled model's every knob is individually wired and effective
        run: |
          set -e
          shopt -s nullglob
          count=0
          for m in models/NAMKnobs_*.nam; do
            echo "--- $m ---"
            ci/build/verify_parametric "$m"
            count=$((count+1))
          done
          if [ "$count" -eq 0 ]; then echo "No bundled models found to verify"; exit 1; fi
          echo "Verified $count bundled models."
        shell: bash

      - name: Assert controls survive host-rate resampling (44.1/48/88.2/96 kHz)
        run: |
          set -e
          shopt -s nullglob
          for m in models/NAMKnobs_*.nam; do
            echo "--- $m ---"
            ci/build/verify_resample "$m"
          done
        shell: bash

  build:
    name: Build-native-plugins
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            build_dir: build-mac
            artifact_ext: mac
          - os: windows-latest
            build_dir: build-win
            artifact_ext: win

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Get VST3 SDK
      run: |
        cd iPlug2/Dependencies/IPlug
        ./download-iplug-sdks.sh
      shell: bash

    - name: Get Prebuilt Libs
      run: |
        cd iPlug2/Dependencies
        ./download-prebuilt-libs.sh
      shell: bash

    - name: Build macOS
      if: matrix.os == 'macOS-latest'
      run: |
        cd ${{env.PROJECT_NAME}}/scripts
        ./makedist-mac.sh full zip
      shell: bash

    - name: Add msbuild to PATH (Windows)
      if: matrix.os == 'windows-latest'
      uses: microsoft/setup-msbuild@v2

    - name: Build Windows
      if: matrix.os == 'windows-latest'
      run: |
        cd ${{env.PROJECT_NAME}}\scripts
        .\makedist-win.bat full zip
      shell: pwsh

    # NAMKnobs: the build outputs bundles named "NeuralAmpModeler.*" (BUNDLE_NAME is kept so the build machinery is
    # untouched). Rename the OUTPUT bundles to "NAMKnobs.*" here so the shipped files don't collide with a stock NAM
    # install on disk. The plugin's internal identity (name + VST3/AU IDs) is already NAMKnobs via config.h.
    - name: Rename bundles to NAMKnobs (macOS)
      if: matrix.os == 'macOS-latest'
      run: |
        set -e
        cd ${{env.PROJECT_NAME}}/build-mac/out
        Z=$(ls *-mac.zip | grep -v dSYMs | head -1)
        echo "renaming bundles in $Z"
        work=_rename; rm -rf "$work"; mkdir "$work"
        (cd "$work" && unzip -q ../"$Z")
        for ext in vst3 component app; do
          b="$work/NeuralAmpModeler.$ext"
          if [ -d "$b" ]; then
            nb="$work/NAMKnobs.$ext"
            mv "$b" "$nb"
            if [ -f "$nb/Contents/MacOS/NeuralAmpModeler" ]; then
              mv "$nb/Contents/MacOS/NeuralAmpModeler" "$nb/Contents/MacOS/NAMKnobs"
              /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable NAMKnobs" "$nb/Contents/Info.plist"
            fi
            /usr/libexec/PlistBuddy -c "Set :CFBundleName NAMKnobs" "$nb/Contents/Info.plist" || true
            echo "  -> NAMKnobs.$ext"
          fi
        done
        rm -f "$Z"
        (cd "$work" && zip -qry ../"NAMKnobs-mac.zip" .)
        rm -rf "$work"
        ls -la
      shell: bash

    # NAMKnobs: best-effort GUI screenshot so the dynamic-knob layout isn't a blind spot. Launches the standalone
    # app with NAMKNOBS_SCREENSHOT_MODEL so it shows a pedal's knobs, then screencaptures. Never fails the build.
    - name: GUI screenshots (macOS, best-effort)
      if: matrix.os == 'macOS-latest'
      continue-on-error: true
      run: |
        set +e
        OUT="$PWD/${{env.PROJECT_NAME}}/build-mac/out"
        SHOTS="$PWD/shots"; mkdir -p "$SHOTS"
        cd "$OUT"; rm -rf _shot; mkdir _shot; (cd _shot && unzip -q ../NAMKnobs-mac.zip)
        APP="$OUT/_shot/NAMKnobs.app/Contents/MacOS/NAMKnobs"
        chmod +x "$APP" 2>/dev/null
        shoot() {
          local model="$1" name="$2"
          echo "== $name : $model =="
          NAMKNOBS_SCREENSHOT_MODEL="$model" "$APP" >"/tmp/$name.log" 2>&1 &
          local pid=$!
          sleep 14
          screencapture -x "$SHOTS/$name.png" 2>&1 || echo "screencapture failed for $name"
          kill "$pid" 2>/dev/null; wait "$pid" 2>/dev/null
          sleep 2
          echo "--- $name app log ---"; tail -20 "/tmp/$name.log" 2>/dev/null
        }
        # macOS pops a screen-recording permission dialog after the first capture, so capture the tightest layout
        # (the 4-knob compressor) first while the screen is clean; the others may show the dialog overlay.
        shoot "$GITHUB_WORKSPACE/models/NAMKnobs_RAT.nam" "1_rat_3knobs"
        shoot "$GITHUB_WORKSPACE/models/NAMKnobs_Compressor.nam" "2_compressor_4knobs"
        shoot "$GITHUB_WORKSPACE/models/NAMKnobs_FuzzFace.nam" "3_fuzz_2knobs"
        rm -rf "$OUT/_shot"
        ls -la "$SHOTS" || true
      shell: bash

    - name: Upload screenshots (macOS, best-effort)
      if: matrix.os == 'macOS-latest'
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: gui-screenshots
        path: shots/
        if-no-files-found: ignore

    - name: Rename bundle to NAMKnobs (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd ${{env.PROJECT_NAME}}\build-win\out
        $z = Get-ChildItem *-win.zip | Where-Object { $_.Name -notlike '*pdbs*' } | Select-Object -First 1
        Write-Host "renaming bundle in $($z.Name)"
        $work = "_rename"; Remove-Item $work -Recurse -Force -ErrorAction Ignore; New-Item -ItemType Directory $work | Out-Null
        Expand-Archive $z.FullName -DestinationPath $work
        if (Test-Path "$work\NeuralAmpModeler.vst3") { Rename-Item "$work\NeuralAmpModeler.vst3" "NAMKnobs.vst3" }
        if (Test-Path "$work\NeuralAmpModeler_x64.exe") { Rename-Item "$work\NeuralAmpModeler_x64.exe" "NAMKnobs_x64.exe" }
        Remove-Item $z.FullName
        Compress-Archive -Path "$work\*" -DestinationPath "NAMKnobs-win.zip"
        Remove-Item $work -Recurse -Force
        Get-ChildItem
      shell: pwsh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.PROJECT_NAME}}-${{matrix.artifact_ext}}
        path: ${{env.PROJECT_NAME}}/${{matrix.build_dir}}/out

  test:
    name: Test Native
    needs: build
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false # one OS's pluginval failing shouldn't cancel the other (better diagnostics)
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            artifact_ext: mac
          - os: windows-latest
            artifact_ext: win

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{env.PROJECT_NAME}}-${{matrix.artifact_ext}}

      - name: Unzip files
        run: |
          unzip *-${{matrix.artifact_ext}}.zip
        shell: bash

      # pluginval's "Open plugin (warm)" test is intermittently crash-flaky on the CI runners (a known issue with
      # the NAM plugin lineage, unrelated to plugin logic -- it reproduces without any model loaded). Retry a few
      # times: a genuine defect fails every attempt, a flaky crash passes within a couple. pluginval is downloaded
      # from latest_release, so this also absorbs churn in that moving target.
      - name: Pluginval (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # Pin to a CURRENT pluginval (v1.0.4, 2024). The workflow inherited "latest_release" from stock NAM, but
          # that tag is a stale 2020 rolling build (pluginval v0.2.7 / JUCE 5.4.7) that flakily segfaults on the
          # "Open plugin (warm)" test of a modern plugin -- the source of the intermittent CI red.
          curl -L "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip" -o pluginval.zip
          unzip -q pluginval.zip
          PV="pluginval.app/Contents/MacOS/pluginval"; [ -x "$PV" ] || PV="./pluginval"; [ -x "$PV" ] || PV="$(find . -type f -name pluginval | head -1)"
          echo "using pluginval at: $PV"; "$PV" --version || true
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          mv NAMKnobs.component ~/Library/Audio/Plug-Ins/Components
          validate() { "$PV" --skip-gui-tests --validate-in-process --output-dir "./bin" --validate "$1"; }
          retry() { for i in 1 2 3; do echo "== $2 attempt $i =="; validate "$1" && return 0; echo "attempt $i failed; retrying"; sleep 3; done; return 1; }
          retry "NAMKnobs.vst3" "VST3" || exit 1
          pgrep -x AudioComponentRegistrar >/dev/null && killall -9 AudioComponentRegistrar || true
          retry "$HOME/Library/Audio/Plug-Ins/Components/NAMKnobs.component" "AU" || exit 1
        shell: bash

      - name: Pluginval (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # Pin to current pluginval v1.0.4 (see the macOS step: "latest_release" is a stale 2020 build that
          # flaky-crashes on warm-open).
          powershell -Command "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12; Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip"
          powershell -Command "Expand-Archive -Force pluginval.zip -DestinationPath ."
          ls -la
          ok=0
          for i in 1 2 3; do
            echo "== pluginval attempt $i =="
            ./pluginval.exe --skip-gui-tests --validate-in-process --output-dir "./bin" --validate NAMKnobs.vst3 && { ok=1; break; }
            echo "attempt $i failed (likely the flaky warm-open crash); retrying"
            sleep 3
          done
          [ "$ok" = "1" ] || { echo "pluginval failed all attempts"; exit 1; }
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.PROJECT_NAME}}-${{matrix.artifact_ext}}-pluginval
          path: ./bin/
